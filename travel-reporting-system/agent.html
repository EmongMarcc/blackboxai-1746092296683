<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Report Submission</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-['Roboto'] min-h-screen flex flex-col items-center p-6">
  <header class="mb-8">
    <h1 class="text-3xl font-bold text-gray-800">Agent Report Submission</h1>
  </header>
  <main class="w-full max-w-lg bg-white rounded-lg shadow p-6">
    <form id="reportForm" class="space-y-6">
      <div>
        <label for="agentName" class="block text-gray-700 font-semibold mb-2">Agent Name</label>
        <input type="text" id="agentName" name="agentName" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label for="serviceType" class="block text-gray-700 font-semibold mb-2">Service Type</label>
        <select id="serviceType" name="serviceType" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">Select a service</option>
          <option value="Visa Service">Visa Service</option>
          <option value="Document Clearing Service">Document Clearing Service</option>
        </select>
      </div>
      <div>
        <label for="description" class="block text-gray-700 font-semibold mb-2">Report Description</label>
        <textarea id="description" name="description" rows="4" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 rounded hover:bg-blue-700 transition">Submit Report</button>
    </form>
    <div id="message" class="mt-4 text-center text-green-600 font-semibold"></div>
  </main>
  <script>
    const form = document.getElementById('reportForm');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageDiv.textContent = '';
      const data = {
        agentName: form.agentName.value.trim(),
        serviceType: form.serviceType.value,
        description: form.description.value.trim(),
      };
      try {
        const response = await fetch('http://localhost:3000/reports', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        if (response.ok) {
          messageDiv.textContent = 'Report submitted successfully!';
          form.reset();
        } else {
          const errorData = await response.json();
          messageDiv.textContent = 'Error: ' + (errorData.error || 'Failed to submit report');
          messageDiv.classList.remove('text-green-600');
          messageDiv.classList.add('text-red-600');
        }
      } catch (error) {
        messageDiv.textContent = 'Error: Could not connect to server';
        messageDiv.classList.remove('text-green-600');
        messageDiv.classList.add('text-red-600');
      }
    });
  </script>
</body>
</html>
